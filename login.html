<!DOCTYPE html>
<html lang="en">
    <head>
            <meta charset="UTF-8">
            <meta http-equiv="X-UA-Compatible" content="IE=edge">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Ecommerce Tutorial</title>
            <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" />
            <link rel="stylesheet" href="style.css">

            <!-- Font Awesome CDN for icons -->
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        }

        body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #00b4db, #0083b0);
        min-height: 100vh;
        }

        /* Navbar */
        #header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #fff;
        padding: 10px 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        position: sticky;
        top: 0;
        z-index: 1000;
        }

        .logo {
        width: 120px;
        }

        #navbar {
        list-style: none;
        display: flex;
        gap: 15px;
        align-items: center;
        }

        #navbar li {
        position: relative;
        }

        #navbar li a {
        text-decoration: none;
        color: #333;
        font-weight: 500;
        padding: 8px 12px;
        }

        #navbar li a.active,
        #navbar li a:hover {
        color: #0083b0;
        }

        #mobile {
        display: none;
        align-items: center;
        gap: 15px;
        }

        #mobile i {
        font-size: 22px;
        color: #333;
        }

        #close {
        display: none;
        }

        /* Responsive Nav */
        @media (max-width: 768px) {
        #navbar {
            flex-direction: column;
            position: fixed;
            top: 0;
            right: -100%;
            background: #fff;
            height: 100vh;
            width: 200px;
            padding-top: 60px;
            transition: right 0.3s ease;
        }

        #navbar.active {
            right: 0;
        }

        #close {
            display: block;
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
        }

        #mobile {
            display: flex;
        }
        }

        /* Form Container */
        .form-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 50px 20px;
        }

        .container {
        background: #fff;
        padding: 30px;
        border-radius: 10px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        transition: 0.3s;
        }

        h2 {
        text-align: center;
        color: #0083b0;
        margin-bottom: 20px;
        }

        input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        }

        button {
        width: 100%;
        padding: 12px;
        background-color: #0083b0;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        }

        button:hover {
        background-color: #005f75;
        }

        .toggle-link {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
        cursor: pointer;
        color: #005f75;
        }

        .toggle-link:hover {
        text-decoration: underline;
        }

        @media (max-width: 480px) {
        h2 {
            font-size: 22px;
        }

        input, button {
            padding: 10px;
            font-size: 15px;
        }
        }
    </style>
    </head>
    <body>

        <!-- Header/Nav -->
        <section id="header">
            <a href="#"><img src="img/logo.png" class="logo" alt="Logo"></a>

            <div>
                <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li id="lg-bag"><a href="cart.html"><i class="fa-regular fa-bag-shopping"></i></a></li>
                <a href="#" id="close"><i class="fa-regular fa-circle-xmark"></i></a>
                </ul>
            </div>

            <div id="mobile">
                <a href="cart.html"><i class="fa-regular fa-bag-shopping"></i></a>
                <i id="bar" class="fas fa-bars"></i>
            </div>
        </section>

        <!-- Login / Signup Form -->
        <div class="form-wrapper">
            <div class="container" id="formContainer">
                <!-- Login Form -->
                <form id="loginForm">
                <h2>Login</h2>
                <input type="email" id="loginEmail" placeholder="Email" required />
                <input type="password" id="loginPassword" placeholder="Password" required />
                <button type="button" onclick="login()">Login</button>
                <div class="toggle-link" onclick="showSignup()">Don't have an account? Sign up</div>
                </form>

                <!-- Signup Form -->
                <form id="signupForm" style="display:none;">
                <h2>Signup</h2>
                <input type="text" id="signupName" placeholder="Full Name" required />
                <input type="email" id="signupEmail" placeholder="Email" required />
                <input type="password" id="signupPassword" placeholder="Password" required />
                <button type="button" onclick="signup()">Sign Up</button>
                <div class="toggle-link" onclick="showLogin()">Already have an account? Login</div>
                </form>
            </div>
        </div>

        <!-- JavaScript -->
        <script>
            // Toggle between login and signup forms
            function showSignup() {
                document.getElementById("loginForm").style.display = "none";
                document.getElementById("signupForm").style.display = "block";
            }

            function showLogin() {
                document.getElementById("signupForm").style.display = "none";
                document.getElementById("loginForm").style.display = "block";
            }

            // Login logic
            function login() {
                const email = document.getElementById("loginEmail").value;
                const password = document.getElementById("loginPassword").value;
                if (email && password) {
                alert("Login Successful!\nEmail: " + email);
                } else {
                alert("Please fill in all fields.");
                }
            }

            // Signup logic
            function signup() {
                const name = document.getElementById("signupName").value;
                const email = document.getElementById("signupEmail").value;
                const password = document.getElementById("signupPassword").value;
                if (name && email && password) {
                alert("Signup Successful!\nWelcome, " + name + "!");
                showLogin();
                } else {
                alert("Please fill in all fields.");
                }
            }

            // Navbar toggle for mobile
            const bar = document.getElementById('bar');
            const nav = document.getElementById('navbar');
            const close = document.getElementById('close');

            if (bar) {
                bar.addEventListener('click', () => {
                nav.classList.add('active');
                });
            }

            if (close) {
                close.addEventListener('click', () => {
                nav.classList.remove('active');
                });
            }
        </script>

    </body>
</html>
